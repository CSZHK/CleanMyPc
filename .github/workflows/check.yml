name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  # 2026-10-26 裁定：Format 不再自动 commit+push 到 main，降为只读。
  contents: read

jobs:
  format:
    name: Format
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref) || github.ref }}

      - name: Cache Homebrew
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/shfmt
            /usr/local/Cellar/shellcheck
            /usr/local/Cellar/golangci-lint
          key: ${{ runner.os }}-brew-quality-v2-${{ hashFiles('**/Brewfile') }}
          restore-keys: |
            ${{ runner.os }}-brew-quality-v2-

      - name: Install tools
        run: brew install shfmt shellcheck golangci-lint

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v5
        with:
          go-version-file: go.mod

      - name: Install goimports
        # @latest 会漂移：v0.50.0 要求 go>=1.26，而 runner 按 go.mod 锁 1.25
        # （GOTOOLCHAIN=local），2026-09-15 起 Format 必炸、quality 从未跑过。
        # 钉 v0.50.0 前最后一档；若 CI 仍拒装则降到 v0.36.0（确定兼容 go 1.25）。
        run: go install golang.org/x/tools/cmd/goimports@v0.49.0

      - name: Format all code
        run: |
          export PATH=$(go env GOPATH)/bin:$PATH
          ./scripts/check.sh --format

      - name: Fail on formatting drift
        # 2026-10-26 裁定：bot 自动 commit+push 到 main 会绕过人审，改为漂移即红，
        # 由人本地跑 ./scripts/check.sh --format 后提交。
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git status --short
            echo "✗ Formatting drift detected — run ./scripts/check.sh --format locally, then commit the result."
            exit 1
          fi
          echo "✓ No formatting drift"

  quality:
    name: Check
    runs-on: macos-latest
    needs: format

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref) || github.ref }}

      - name: Cache Homebrew
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/shfmt
            /usr/local/Cellar/shellcheck
            /usr/local/Cellar/golangci-lint
          key: ${{ runner.os }}-brew-quality-v2-${{ hashFiles('**/Brewfile') }}
          restore-keys: |
            ${{ runner.os }}-brew-quality-v2-

      - name: Install tools
        run: brew install shfmt shellcheck golangci-lint

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v5
        with:
          go-version-file: go.mod

      - name: Run check script
        run: ./scripts/check.sh --no-format

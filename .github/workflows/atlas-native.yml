name: Atlas Native

on:
  workflow_dispatch:
  push:
    paths:
      - 'Apps/**'
      - 'Packages/**'
      - 'XPC/**'
      - 'Helpers/**'
      - 'project.yml'
      - 'scripts/atlas/**'
      - '.github/workflows/atlas-native.yml'

jobs:
  build-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build and package Atlas native app
        run: ./scripts/atlas/package-native.sh

      - name: Verify DMG can install to the user Applications folder
        run: ./scripts/atlas/verify-dmg-install.sh

      - name: Upload native app and installer artifacts
        uses: actions/upload-artifact@v4
        env:
          # 保险带：upload-artifact@v4 的 node24 默认 ~2GB 堆顶偏紧。
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          name: atlas-native-app
          # 只传真正的交付物，不能裸写 dist/native/*：
          # dmg-root/（DMG 暂存树）里的 Applications 是指向 /Applications 的符号链接，
          # v4 会顺着链接把 runner 的整个 /Applications（含 Python 3.11 的 "Icon\r"）
          # 卷进产物——585 万文件既撑爆 node 堆（0657b81 三次 OOM 同因）又含非法字符。
          path: |
            dist/native/*.app
            dist/native/*.dmg
            dist/native/*.pkg
            dist/native/*.zip
            dist/native/*.sha256
